name: Release

on:
    push:
        tags: ["*"]

permissions:
    contents: write
    # Artifact attestations: the signing step below mints an OIDC token and
    # uploads attestation records to the repo's attestation store.
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              # Same pin as the test workflow so the released bundle is built by
              # the toolchain the tests were run against.
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile

            # No stamping here any more. `scripts/release.mjs` commits the bump to
            # the default branch and then tags that commit, so the checkout this
            # workflow gets already carries the right version. Stamping in CI is
            # what left master's manifest at 0.1.0-alpha.9 for thirty-odd
            # releases: the write happened in a throwaway checkout and the branch
            # Obsidian's bot actually reads never saw it.
            #
            # What remains is the assertion, which is the valuable half — it
            # fails a tag that does not match the tree it points at, including a
            # tag pushed by hand.
            - name: Verify committed versions match the tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  for f in manifest.json package.json; do
                      FILE_VERSION=$(node -p "require('./$f').version")
                      if [ "$TAG" != "$FILE_VERSION" ]; then
                          echo "$f version $FILE_VERSION does not match tag $TAG"
                          exit 1
                      fi
                  done
                  node -e "const v=require('./versions.json'); if(!(('$TAG') in v)) process.exit(1)" \
                      || { echo "versions.json has no entry for $TAG"; exit 1; }

            # Every gate below runs against this exact artifact — the one that
            # gets uploaded. 0.1.0-alpha.3 shipped a bundle that could not be
            # loaded at all because nothing in this workflow ever inspected the
            # built output, only the sources it came from.
            - name: Build
              run: npm run build

            - name: Check bundle for loader-incompatible constructs
              run: npm run check:bundle

            - name: Verify standard skill resource and bundle digest
              run: npm run check:skills

            # The copy tables are the single source for every user-visible
            # string; this catches the ones that never got there. Two branches
            # have shipped hardcoded English past review, and the ContextRow
            # case was six `aria-label`s — invisible on screen, and asserted in
            # English by the component's own passing tests.
            - name: Check for hardcoded user-visible copy
              run: npm run check:copy

            # The version belongs in manifest.json and nowhere else. Two places
            # had quietly grown a second copy: mcpManager.ts reported 1.0.0 to
            # every MCP server for two releases after 1.0.0, and both READMEs
            # described a shipped 1.0.x plugin as early alpha. Neither could fail
            # any other gate, because nothing reads those strings back.
            - name: Check for version numbers written outside the manifest
              run: npm run check:version

            # Includes the smoke test that evaluates main.js the way Obsidian
            # does and runs onload on both desktop and mobile platform shapes.
            - name: Test
              run: bun test

            - name: Lint
              run: npm run lint

            - name: Verify manifest version matches the tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  if [ "$TAG" != "$MANIFEST_VERSION" ]; then
                      echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
                      exit 1
                  fi

            - name: Package plugin files
              run: |
                  mkdir -p dist
                  cp main.js manifest.json styles.css dist/

            # The gates above ran against the repo-root main.js; assert the copy
            # in dist/ is byte-identical, so what ships is what was verified.
            - name: Verify packaged bundle matches the verified build
              run: |
                  if ! cmp -s main.js dist/main.js; then
                      echo "dist/main.js differs from the verified main.js"
                      exit 1
                  fi
                  node scripts/check-bundle.mjs dist/main.js
                  node scripts/check-skills.mjs dist/main.js

            # Cryptographic proof that these files were built by this repo,
            # from the tag that triggered this run — Scorecard's "artifact
            # attestation" check. Sits after the dist/ byte-compare so it signs
            # exactly the bytes that were verified, not a rebuild.
            - uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                      dist/builtin-skills.json

            # GitHub's own auto-detect picked the same ancient tag as the
            # previous version for every release (it landed on 1.0.20 for all
            # sixty-odd 1.0.x notes), so the generated "What's Changed" and the
            # Full Changelog link were wrong for almost the entire series.
            # Ask for the previous tag explicitly: the most recent release by
            # creation time other than the one being published, then render the
            # notes with the same engine the edit page uses.
            - name: Generate release notes with the correct previous tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
                      --jq '.[] | select(.tag_name != "'"$GITHUB_REF_NAME"'") | .created_at + " " + .tag_name' \
                      | sort | tail -1 | cut -d' ' -f2-)
                  echo "Previous release tag: ${PREV:-none}"
                  if [ -n "$PREV" ]; then
                      gh api repos/${{ github.repository }}/releases/generate-notes \
                          -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body > release-notes.md
                  else
                      gh api repos/${{ github.repository }}/releases/generate-notes \
                          -f tag_name="$TAG" --jq .body > release-notes.md
                  fi

            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                      dist/builtin-skills.json
                  body_path: release-notes.md

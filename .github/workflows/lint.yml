name: Build and test

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    # Lets the gate be run on demand from the Actions tab.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # Pinned so CI and local runs agree. An unpinned setup-bun
                  # installs the newest release, which is how a mock-ordering
                  # bug reached CI while every local run stayed green.
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile

            # Build first: the bundle gates below assert on main.js, and
            # `bun test` includes a smoke test that loads that artifact. Running
            # tests before the build would silently check a stale bundle — or
            # none at all on a clean checkout.
            - name: Build
              run: npm run build

            # Catches constructs Obsidian's eval-based loader cannot handle, such
            # as the `import("electron")` that shipped in 0.1.0-alpha.3.
            - name: Check bundle for loader-incompatible constructs
              run: npm run check:bundle

            - name: Verify standard skill resource and bundle digest
              run: npm run check:skills

            # The copy tables are the single source for every user-visible
            # string; this catches the ones that never got there. Two branches
            # have shipped hardcoded English past review, and the ContextRow
            # case was six `aria-label`s — invisible on screen, and asserted in
            # English by the component's own passing tests.
            - name: Check for hardcoded user-visible copy
              run: npm run check:copy

            # Runs here as well as at release time so a second copy of the
            # version is caught in the PR that introduces it. Catching it only on
            # release means the drift is already merged, which is how
            # mcpManager.ts's stale 1.0.0 survived two releases.
            - name: Check for version numbers written outside the manifest
              run: npm run check:version

            - name: Test
              run: bun test

            - name: Lint
              run: npm run lint
